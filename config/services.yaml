# Servicios monitoreados por PanaStatus.
#
# Reglas de monitoreo responsable (validadas en código, ver src/panastatus/config.py):
#   - Solo páginas públicas, sin login.
#   - interval_seconds entre 60 y 300 (1 petición cada 1–5 min por servicio).
#
# Campos:
#   id               identificador corto (minúsculas, números y guiones). No lo cambies después:
#                    es la llave en la base de datos y en las suscripciones del bot.
#   name             nombre visible.
#   category         una de las llaves de "categories".
#   url              página pública a revisar.
#   interval_seconds cada cuánto se revisa (default 180).
#   slow_threshold_ms latencia a partir de la cual se considera "lento" (default 3000).
#   enabled          false para pausarlo sin borrarlo.
#
# Solicitudes de exclusión (prometidas en /bot/: máximo 48 h):
#   poner enabled: false y dejar un comentario con la fecha y el motivo, por ejemplo:
#     enabled: false  # excluido a solicitud del sitio, 2026-11-23
#   No borres la entrada: así queda registro y se conserva el historial en la DB.

categories:
  bancos: "🏦 Bancos"
  gobierno: "🏛️ Gobierno"
  educacion: "🎓 Educación"
  globales: "🌐 Servicios globales"

