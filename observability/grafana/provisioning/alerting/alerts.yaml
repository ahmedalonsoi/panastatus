# Alertas INTERNAS (meta-monitoreo): avisan si PanaStatus mismo deja de funcionar.
# Las caídas de los servicios monitoreados las avisa el worker; esto vigila al vigilante.
#
# Grafana sustituye $TELEGRAM_BOT_TOKEN y $ADMIN_CHAT_ID con las variables de entorno.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-admin
    receivers:
      - uid: telegram-admin
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "$ADMIN_CHAT_ID"
          parse_mode: HTML

policies:
  - orgId: 1
    receiver: telegram-admin
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: panastatus-interno
    folder: PanaStatus
    interval: 1m
    rules:
      # 1) El checker no registra revisiones: worker caído, colgado o sin acceso a internet.
      - uid: checker-sin-revisiones
        title: Checker sin revisiones
        condition: C
        for: 5m
        noDataState: Alerting # sin datos = el worker no está enviando nada
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: El worker de PanaStatus no ha hecho revisiones en los últimos 10 minutos.
          runbook: docker compose ps worker && docker compose logs --tail=100 worker
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(increase(panastatus_checks_total[10m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # 2) Muchas revisiones fallan a la vez: lo más probable es que el problema sea
      #    NUESTRO (DNS o red del servidor), no de 18 sitios distintos al mismo tiempo.
      - uid: fallas-masivas
        title: Fallas masivas (posible problema de red propio)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: Más del 50 % de las revisiones fallan. Revisar la red y el DNS del servidor antes de culpar a los sitios.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: sum(rate(panastatus_checks_total{result="fail"}[10m])) / sum(rate(panastatus_checks_total[10m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
              refId: C

      # 3) Telegram rechaza o no recibe los mensajes (token revocado, red, etc.).
      - uid: telegram-fallando
        title: Envíos a Telegram fallando
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: Hubo más de 3 envíos fallidos a Telegram en 15 minutos.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              expr: sum(increase(panastatus_notifications_total{outcome="failed"}[15m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }
              refId: C
