[project]
name = "panastatus"
version = "0.1.0"
description = "Monitor público de disponibilidad de servicios web de Panamá"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",               # cliente HTTP async (checker + envío a Telegram)
    "pydantic>=2.7",             # validación de config/services.yaml
    "pydantic-settings>=2.3",    # lee variables de entorno / .env
    "pyyaml>=6.0",
    "asyncpg>=0.29",             # driver PostgreSQL async (SQL explícito, sin ORM)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-telegram-bot>=21.0",
    "slowapi>=0.1.9",            # límite de peticiones en la API
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "anthropic>=2.12",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "respx>=0.21",               # simula respuestas HTTP en los tests
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panastatus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: necesita PostgreSQL + TimescaleDB (TEST_DATABASE_URL)"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# asyncpg no publica tipos (py.typed). Sus objetos se tratan como Any.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["panastatus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
