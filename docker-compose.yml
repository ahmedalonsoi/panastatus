# Uso:
#   docker compose up -d --build     # levantar todo → página en http://localhost:8080
#   docker compose logs -f worker    # ver el checker en vivo
#   docker compose down              # detener (los datos quedan en el volumen)
#
# Los valores ${...} salen del archivo .env.

# Nombre fijo del proyecto (prefijo de contenedores y volúmenes), sin importar la carpeta.
name: panastatus

x-app: &app
  build: .
  env_file: .env
  environment:
    # Dentro de la red de Docker la DB se llama "db", no "localhost".
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Métricas OpenTelemetry → Alloy (ver src/panastatus/telemetry.py).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    # Solo las métricas HTTP del estándar estable (http_server_request_duration_seconds).
    OTEL_SEMCONV_STABILITY_OPT_IN: http
  depends_on:
    # Arranca solo cuando las migraciones terminaron bien (esquema al día).
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_signal: SIGINT  # Python lo recibe como KeyboardInterrupt y cierra limpio

services:
  db:
    # Versión fija: una actualización de la DB se hace a propósito, nunca por accidente.
    image: timescale/timescaledb:2.32.1-pg17
    # Desactiva la telemetría que TimescaleDB envía a sus servidores por defecto.
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Solo en 127.0.0.1: accesible desde tu PC, NO desde la red/internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Tarea única: aplica las migraciones pendientes (db/migrate.sh) y termina.
  migrate:
    image: timescale/timescaledb:2.32.1-pg17
    entrypoint: ["/bin/sh", "/db/migrate.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app
    command: ["python", "-m", "panastatus.worker"]

  api:
    <<: *app
    command:
      - uvicorn
      - panastatus.api:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers           # detrás de Caddy (Fase 3) para ver la IP real del cliente
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:8000:8000"

  # Caddy + página estática (Next.js). En local escucha en :8080 sin HTTPS.
  # En producción (deploy/compose.prod.yml) escucha en 80/443 con certificado real.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

  bot:
    <<: *app
    command: ["python", "-m", "panastatus.bot"]
    # Si no hay TELEGRAM_BOT_TOKEN el bot sale con código 0 y no se reinicia en bucle.
    restart: on-failure

  # ------------------------------------------------------------------
  # Observabilidad interna: Alloy → Prometheus (métricas) + Loki (logs) → Grafana.
  # Ninguno se expone a internet; Grafana solo en 127.0.0.1 (en producción se entra
  # por un túnel SSH, ver docs/operacion.md).
  # ------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    environment:
      COMPOSE_PROJECT: panastatus
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Solo lectura: Alloy lee los logs de los contenedores a través de Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-otlp-receiver     # recibe métricas OpenTelemetry de Alloy
      # Al reiniciar un proceso, sus contadores vuelven a 0. Con esto Prometheus usa la hora
      # de inicio que envía OpenTelemetry y no pierde el primer incremento.
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.22
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Falta GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/panastatus.json
      # Para las alertas internas por Telegram (provisioning/alerting/alerts.yaml).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus, loki]
    restart: unless-stopped

volumes:
  db_data:
  alloy_data:
  prometheus_data:
  loki_data:
  grafana_data:
