<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PanaStatus — Estado de servicios web de Panamá</title>
<meta name="description" content="Disponibilidad en tiempo real de bancos, gobierno, universidades y servicios globales en Panamá.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16191f; --muted: #5f6672; --line: #e3e6eb;
    --up: #1f9d55; --degraded: #d69e2e; --down: #d64545; --unknown: #a0a7b4; --empty: #e8ebef;
    --accent: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a20; --text: #e7e9ee; --muted: #9aa1ad; --line: #272b33;
      --up: #34c174; --degraded: #e6b143; --down: #f06363; --unknown: #6b7280; --empty: #262a31;
      --accent: #6aa1ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 1.5rem; margin: 0; }
  h1 span { color: var(--accent); }
  .muted { color: var(--muted); font-size: .85rem; }
  .banner { margin: 20px 0 28px; padding: 18px 20px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 1.1rem; }
  .banner.operational { background: var(--up); }
  .banner.degraded { background: var(--degraded); }
  .banner.outage { background: var(--down); }
  .banner.loading { background: var(--unknown); }
  section.cat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 20px; }
  section.cat h2 { font-size: 1rem; margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .svc { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .svc:last-child { border-bottom: 0; }
  .svc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; }
  .svc-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .st { font-size: .85rem; font-weight: 600; white-space: nowrap; }
  .up { color: var(--up); } .degraded { color: var(--degraded); } .down { color: var(--down); } .unknown { color: var(--unknown); }
  .bg-up { background: var(--up); } .bg-degraded { background: var(--degraded); }
  .bg-down { background: var(--down); } .bg-unknown { background: var(--unknown); }
  .bars { display: flex; gap: 2px; height: 30px; margin-top: 10px; }
  .bars i { flex: 1; border-radius: 2px; background: var(--empty); }
  .bars i.b-up { background: var(--up); } .bars i.b-minor { background: var(--degraded); } .bars i.b-major { background: var(--down); }
  .bars-legend { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-top: 4px; }
  .detail { margin-top: 12px; font-size: .85rem; color: var(--muted); }
  .detail svg { width: 100%; height: 90px; display: block; margin-top: 6px; }
  .incidents { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px; }
  .inc { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .inc:last-child { border-bottom: 0; }
  footer { margin-top: 40px; font-size: .8rem; color: var(--muted); text-align: center; }
  a { color: var(--accent); }
  #tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: .75rem;
         padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 10; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pana<span>Status</span></h1>
    <span class="muted" id="updated">Cargando…</span>
  </header>

  <div class="banner loading" id="banner">Consultando servicios…</div>

  <div id="categories"></div>

  <h2 style="font-size:1.1rem;margin-top:36px">Incidentes recientes</h2>
  <div class="incidents" id="incidents"><p class="muted">Cargando…</p></div>

  <footer>
    PanaStatus revisa solo páginas públicas cada 1–5 minutos, con un User-Agent identificable.<br>
    Barra: disponibilidad diaria de los últimos 90 días · <a href="/api/docs">API pública</a>
  </footer>
</main>
<div id="tip" hidden></div>

<script>
// ---------------------------------------------------------------------------
// Página de estado: todo se arma con 3 peticiones a la API y se refresca cada 60 s.
// ---------------------------------------------------------------------------
const STATUS = {
  up: "Operativo", degraded: "Lento", down: "Caído", unknown: "Sin datos",
};
const BANNER = {
  operational: "✓ Todos los servicios operan con normalidad",
  degraded: "Algunos servicios están lentos",
  outage: "Hay servicios caídos",
};
const DAYS = 90;
const tz = { timeZone: "America/Panama" };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => v == null ? "—" : (v * 100).toFixed(2) + "%";
const fmtTime = (iso) => new Date(iso).toLocaleString("es-PA", { ...tz, dateStyle: "medium", timeStyle: "short" });
function fmtDuration(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? `${h} h ${m} min` : m ? `${m} min` : `${sec} s`;
}
const api = (path) => fetch(path).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

// Lista de los últimos 90 días (fechas de Panamá, formato AAAA-MM-DD)
function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    out.push(d.toLocaleDateString("en-CA", tz));
  }
  return out;
}

function barsHtml(points) {
  const byDay = Object.fromEntries((points || []).map((p) => [p.day, p]));
  return lastDays(DAYS).map((day) => {
    const p = byDay[day];
    if (!p) return `<i data-tip="${day}: sin datos"></i>`;
    const cls = p.uptime >= 0.999 ? "b-up" : p.uptime >= 0.98 ? "b-minor" : "b-major";
    return `<i class="${cls}" data-tip="${day}: ${pct(p.uptime)} disponible"></i>`;
  }).join("");
}

function render(services, daily) {
  const groups = {};
  for (const s of services) (groups[s.category_label] ??= []).push(s);
  document.getElementById("categories").innerHTML = Object.entries(groups).map(([label, list]) => `
    <section class="cat">
      <h2>${esc(label)}</h2>
      ${list.map((s) => `
        <div class="svc" data-id="${esc(s.id)}">
          <div class="svc-head">
            <span class="svc-name"><span class="dot bg-${s.status}"></span>${esc(s.name)}</span>
            <span class="st ${s.status}">${STATUS[s.status]}${s.last_latency_ms != null && s.status !== "down" ? ` · ${s.last_latency_ms} ms` : ""}</span>
          </div>
          <div class="bars">${barsHtml(daily[s.id])}</div>
          <div class="bars-legend"><span>hace ${DAYS} días</span><span>24 h: ${pct(s.uptime_24h)}</span><span>hoy</span></div>
          <div class="detail" hidden></div>
        </div>`).join("")}
    </section>`).join("");
}

// Al tocar un servicio: latencia de las últimas 24 h (gráfico SVG simple)
async function toggleDetail(svcEl) {
  const box = svcEl.querySelector(".detail");
  if (!box.hidden) { box.hidden = true; return; }
  box.hidden = false;
  box.textContent = "Cargando latencia…";
  const id = svcEl.dataset.id;
  const [pts, svc] = await Promise.all([api(`/api/services/${id}/latency?hours=24`), api(`/api/services/${id}`)]);
  const vals = pts.map((p) => p.avg_ms).filter((v) => v != null);
  const info = `Disponibilidad 7 d ${pct(svc.uptime["7d"])} · 30 d ${pct(svc.uptime["30d"])} · 90 d ${pct(svc.uptime["90d"])}`
    + (svc.ssl_days_left != null ? ` · SSL vence en ${svc.ssl_days_left} días` : "")
    + (svc.last_error ? ` · Último error: ${esc(svc.last_error)}` : "");
  if (vals.length < 2) { box.innerHTML = `${info}<br>Aún no hay suficientes datos de latencia.`; return; }
  const max = Math.max(...vals) * 1.1, W = 600, H = 90;
  const x = (i) => (i / (pts.length - 1)) * W;
  const y = (v) => H - (v / max) * (H - 4);
  const path = pts.map((p, i) => p.avg_ms == null ? null : `${x(i).toFixed(1)},${y(p.avg_ms).toFixed(1)}`)
    .filter(Boolean).join(" L");
  const fails = pts.map((p, i) => p.failures ? `<rect x="${x(i) - 2}" y="0" width="4" height="${H}" fill="var(--down)" opacity=".35"/>` : "").join("");
  box.innerHTML = `${info}<br>Latencia promedio, últimas 24 h (máx. ${Math.max(...vals)} ms):
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Latencia 24 horas">
      ${fails}<path d="M${path}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>`;
}

function renderIncidents(list) {
  const el = document.getElementById("incidents");
  if (!list.length) { el.innerHTML = `<p class="muted">Sin incidentes registrados. 🎉</p>`; return; }
  el.innerHTML = list.map((i) => `
    <div class="inc">
      <strong>${esc(i.service_name)}</strong>
      <span class="st ${i.resolved_at ? "up" : "down"}">· ${i.resolved_at ? "Resuelto" : "En curso"}</span><br>
      <span class="muted">${fmtTime(i.started_at)} · duración ${fmtDuration(i.duration_seconds)}${i.cause ? " · " + esc(i.cause) : ""}</span>
    </div>`).join("");
}

async function load() {
  try {
    const [summary, services, daily, incidents] = await Promise.all([
      api("/api/summary"), api("/api/services"), api(`/api/uptime/daily?days=${DAYS}`), api("/api/incidents?limit=15"),
    ]);
    const banner = document.getElementById("banner");
    banner.className = `banner ${summary.overall}`;
    banner.textContent = BANNER[summary.overall];
    document.getElementById("updated").textContent =
      summary.last_checked_at ? `Última revisión: ${fmtTime(summary.last_checked_at)}` : "Sin revisiones aún";
    const open = new Set([...document.querySelectorAll(".detail:not([hidden])")].map((d) => d.parentElement.dataset.id));
    render(services, daily);
    renderIncidents(incidents);
    open.forEach((id) => { const el = document.querySelector(`.svc[data-id="${id}"]`); if (el) toggleDetail(el); });
  } catch (e) {
    document.getElementById("updated").textContent = "No se pudo actualizar (" + e.message + ")";
  }
}

// Eventos: clic para detalle, tooltip en las barras
document.addEventListener("click", (e) => {
  const head = e.target.closest(".svc-head");
  if (head) toggleDetail(head.parentElement);
});
const tip = document.getElementById("tip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.dataset?.tip;
  tip.hidden = !t;
  if (t) { tip.textContent = t; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; }
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
