# CD: en cada push a main (con el CI en verde) construye las imágenes, las escanea y,
# si el despliegue está habilitado, las instala en el servidor.
#
#   ci ──► build (amd64 + arm64) ──► GHCR ──► escaneo Trivy ──► deploy (SSH)
#
# El despliegue solo corre si la variable del repositorio DEPLOY_ENABLED = "true"
# (Settings → Secrets and variables → Actions → Variables). Así el repo funciona antes de
# tener servidor. Además usa el environment "production": en GitHub se le puede exigir
# aprobación manual antes de cada despliegue.
#
# Secretos necesarios (Settings → Secrets → Actions):
#   DEPLOY_HOST         IP o dominio del servidor
#   DEPLOY_SSH_KEY      clave privada SSH (dedicada al despliegue) del usuario deploy
#   DEPLOY_KNOWN_HOSTS  salida de: ssh-keyscan -t ed25519 <IP>   (evita ataques MITM)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para redesplegar a mano

permissions:
  contents: read

concurrency:
  group: deploy # nunca dos despliegues a la vez
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR exige minúsculas en el nombre de la imagen.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar en GHCR
    strategy:
      fail-fast: false # si una imagen falla, la otra termina igual (diagnóstico completo)
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de imagen en minúsculas
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_PREFIX }}/panastatus-${{ matrix.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # QEMU + Buildx: construir para ARM (el servidor Ampere) desde un runner x86.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM y procedencia: qué contiene la imagen y cómo se construyó.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Escaneo de vulnerabilidades: falla si hay CRÍTICAS con parche disponible.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          # Solo vulnerabilidades. Los secretos se buscan con gitleaks sobre el repo (job ci/secretos);
          # el escáner de secretos de Trivy da falsos positivos con la documentación de librerías
          # de terceros (p. ej. docstrings del SDK de Anthropic).
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # para que el servidor descargue las imágenes privadas de GHCR
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copiar archivos de despliegue
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Solo lo que el servidor necesita (configuración), nunca código fuente ni secretos.
          tar czf deploy.tgz docker-compose.yml deploy/compose.prod.yml deploy/deploy.sh db observability
          scp -i ~/.ssh/id_deploy deploy.tgz "deploy@$HOST:/opt/panastatus/"
      - name: Desplegar
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          # Token temporal del job: vence al terminar, así no queda ninguna credencial
          # permanente de GHCR guardada en el servidor.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          app="ghcr.io/$registry_owner/panastatus-app:$GITHUB_SHA"
          web="ghcr.io/$registry_owner/panastatus-web:$GITHUB_SHA"
          # El token viaja por stdin (nunca en la línea de comandos, que queda en logs).
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy "deploy@$HOST" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null"
          # Se despliega y SIEMPRE se cierra la sesión de GHCR, aunque falle.
          ssh -i ~/.ssh/id_deploy "deploy@$HOST" \
            "cd /opt/panastatus && tar xzf deploy.tgz && rm deploy.tgz && \
             (sh deploy/deploy.sh '$app' '$web'; s=\$?; docker logout ghcr.io >/dev/null; exit \$s)"
