# CI: corre en cada pull request y en cada push a main. Si algo falla, no se despliega.
#
#   python      → Ruff (estilo y errores) + mypy (tipos) + pytest con cobertura mínima
#   integracion → TimescaleDB real: migraciones (dos veces: deben ser idempotentes) + SQL
#   frontend    → ESLint + TypeScript + Vitest + build de Next.js + npm audit
#   infra       → formato y validación de OpenTofu + validación de los docker compose
#   secretos    → gitleaks busca claves/tokens filtrados en TODO el historial
#
# Las acciones se fijan por SHA de commit (no por etiqueta): una etiqueta se puede mover
# a código malicioso, un SHA no. Dependabot las mantiene al día.
name: CI

on:
  # En main lo ejecuta deploy.yml (workflow_call) antes de construir: así no corre dos veces.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # La cobertura mínima es un trinquete: solo se sube, nunca se baja.
      - run: uv run pytest -q -m "not integration" --cov --cov-report=term --cov-fail-under=45

  integracion:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.32.1-pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: panastatus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: panastatus_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/panastatus_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --frozen
      - name: Migraciones (dos veces; la segunda no debe aplicar nada)
        run: |
          sh db/migrate.sh
          sh db/migrate.sh | tee second.log
          grep -q "(0 migraciones nuevas)" second.log
      - run: uv run pytest -q -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vulnerabilidades altas o críticas en dependencias
        run: npm audit --omit=dev --audit-level=high

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
      - name: OpenTofu fmt + validate
        working-directory: infra/oracle
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate
      - name: Docker Compose (desarrollo y producción)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          GRAFANA_ADMIN_PASSWORD: ci
          APP_IMAGE: ghcr.io/example/app:ci
          WEB_IMAGE: ghcr.io/example/web:ci
          DOMAIN: example.com
          ACME_EMAIL: ci@example.com
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f deploy/compose.prod.yml config -q

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
